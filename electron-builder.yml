appId: com.gitdeck.app
productName: GitDeck
directories:
  output: dist
files:
  - out/**
  - package.json
  - build/icons/*.png
# node-pty loads a native addon and spawn-helper: both must live outside app.asar.
asarUnpack:
  - node_modules/node-pty/**
# One runner builds both architectures: node-pty ships prebuilds, so no rebuild.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signed ('-'): there is no Developer ID, but Apple silicon will not launch an app with no
  # signature at all ('is damaged'). Hardened runtime off: library validation rejects Electron's own
  # frameworks under an ad-hoc signature. See README (Gatekeeper).
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
# macOS installer window: installer design E-1 (Sunrise, Sun colours). x/y are icon centres
# and sit on the ends of the commit line drawn in build/background.png (@2x is picked up too).
dmg:
  title: ${productName} ${version}
  background: build/background.png
  icon: build/icon.icns
  iconSize: 80
  iconTextSize: 13
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 210
      type: file
    - x: 480
      y: 210
      type: link
      path: /Applications
