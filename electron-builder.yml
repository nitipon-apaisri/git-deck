appId: com.gitdeck.app
productName: GitDeck
directories:
  output: dist
files:
  - out/**
  - package.json
  - build/icon.png
  - build/icons/*.png
# node-pty loads a native addon and spawn-helper: both must live outside app.asar.
asarUnpack:
  - node_modules/node-pty/**
# One runner builds both architectures: node-pty ships prebuilds, so no rebuild.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signed ('-'): there is no Developer ID, but Apple silicon will not launch an app with no
  # signature at all ('is damaged'). Hardened runtime off: library validation rejects Electron's own
  # frameworks under an ad-hoc signature. See README (Gatekeeper).
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
