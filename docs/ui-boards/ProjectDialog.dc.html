<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New project dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141517;--island:#1E1F22;--island-2:#26282C;--hover:#2B2D31;--line:#303338;--text:#DFE1E5;--muted:#9498A2;--accent:#5B93F8;--green:#6FCB8B}
body{margin:0;background:#1E1F22}
*{box-sizing:border-box}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:14px;height:14px}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--text)}
.btn{display:flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px}
.btn:hover{background:var(--hover)}
.ico:hover{background:var(--hover)}
input[type=checkbox]{width:16px;height:16px;accent-color:#5B93F8;margin:0}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5v.01M7 16.5v.01"></path></symbol>
<symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"></path></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"></path></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7z"></path><path d="M4 7l8 4 8-4"></path><path d="M12 11v10"></path></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></symbol>
<symbol id="i-cpu" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"></rect><path d="M10 3v3M14 3v3M10 18v3M14 18v3M3 10h3M3 14h3M18 10h3M18 14h3"></path></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"></path></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></symbol>
<symbol id="i-credit-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect><path d="M2.5 10h19"></path><path d="M6.5 15h3"></path></symbol>
<symbol id="i-bar-chart" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"></path></symbol>
<symbol id="i-git-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2"></circle><circle cx="6" cy="19" r="2.2"></circle><circle cx="18" cy="8" r="2.2"></circle><path d="M6 7.2v9.6"></path><path d="M18 10.2c0 4-4 5-12 7"></path></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"></path></symbol>
</svg>
<div style="width: 560px; height: 740px; display: flex; flex-direction: column; background: var(--island); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.4; border: 1px solid var(--line)">

  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 600">New project</span>
      <span style="color: var(--muted)">Group repositories from any host under one name.</span>
    </div>
    <button class="ib" aria-label="Close" style="margin-left: auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </div>

  <div style="flex: 1; padding: 4px 24px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pname" style="font-weight: 500">Name</label>
      <input id="pname" value="Payments platform" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--island-2); outline: 0; box-shadow: 0 0 0 3px rgba(91,147,248,.22)">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted)">
        <span style="display: inline-flex; align-items: center; gap: 5px; color: #8FDBA6"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><use href="#i-check"></use></svg>Name is available</span>
        <span>17 / 60</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 500">Icon</span>
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted)">
          <svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"></use></svg>
          <input aria-label="Search icons" placeholder="Search icons" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text)">
        </label>
        <input aria-label="Or paste an emoji" placeholder="Or paste an emoji" style="width: 150px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; outline: 0">
      </div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="16">
          <button class="ico" aria-label="{{i.label}}" aria-pressed="{{i.on}}" style="height: 44px; border-radius: 10px; border: 1px solid {{i.bd}}; background: {{i.bg}}; color: {{i.fg}}; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="{{i.href}}"></use></svg></button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 500">Color</span>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="8">
          <button aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid {{c.ring}}; background: {{c.hex}}; padding: 0; color: #0E1A33; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--island)">
            <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><use href="#i-check"></use></svg></sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--island-2)">
      <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(63,191,168,.2); color: #8EDDC8; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><use href="#i-credit-card"></use></svg></div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 600; font-size: 14px">Payments platform</span>
        <span style="color: var(--muted); font-size: 12px">Preview · 3 repositories</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; min-height: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-weight: 500">Repositories <span style="color: var(--muted); font-weight: 400">(optional)</span></span>
        <span style="color: var(--muted); font-size: 12px">3 selected</span>
      </div>
      <div style="border: 1px solid var(--line); border-radius: 10px; overflow: hidden">
        <sc-for list="{{repos}}" as="r" hint-placeholder-count="4">
          <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-bottom: 1px solid var(--line)">
            <input type="checkbox" checked="{{r.on}}" aria-label="Add {{r.name}}">
            <span style="width: 20px; height: 20px; border-radius: 6px; background: {{r.badgeBg}}; display: grid; place-items: center; font-size: 10px; font-weight: 600">{{r.badge}}</span>
            <span style="font-weight: 500">{{r.name}}</span>
            <span style="margin-left: auto; color: var(--muted); font-size: 12px">{{r.where}}</span>
          </label>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line)">
    <button class="btn">Cancel</button>
    <button class="btn" style="background: #2E69DC; border-color: #2E69DC; color: #fff; font-weight: 500">Create project</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['folder', 'layers', 'server', 'database', 'cloud', 'shield', 'zap', 'package', 'globe', 'cpu', 'code', 'terminal', 'credit-card', 'bar-chart', 'git-branch', 'star'];
    const icons = names.map((n) => {
      const on = n === 'credit-card';
      return {
        label: n.replace('-', ' '),
        href: '#i-' + n,
        on,
        bd: on ? '#5B93F8' : '#303338',
        bg: on ? 'rgba(91,147,248,.2)' : 'transparent',
        fg: on ? '#B8CCFF' : '#DFE1E5'
      };
    });
    const cs = [
      ['Blue', '#5B93F8'], ['Teal', '#3FBFA8'], ['Violet', '#A57AF0'], ['Amber', '#E9B05A'],
      ['Rose', '#F58A8E'], ['Green', '#6FCB8B'], ['Pink', '#E57FBF'], ['Gray', '#8C909A']
    ];
    const colors = cs.map(([label, hex]) => ({
      label, hex, on: label === 'Teal', ring: label === 'Teal' ? '#DFE1E5' : 'transparent'
    }));
    const repos = [
      { name: 'payments-api', badge: 'SH', badgeBg: '#2A3440', where: 'gitlab.acme.dev · payments', on: true },
      { name: 'ledger-service', badge: 'GH', badgeBg: '#2C2F34', where: 'GitHub · acme-pay', on: true },
      { name: 'infra-modules', badge: 'GL', badgeBg: '#3A2F2A', where: 'GitLab.com · platform', on: true },
      { name: 'checkout-web', badge: 'GH', badgeBg: '#2C2F34', where: 'GitHub · acme-pay', on: false }
    ];
    return { icons, colors, repos };
  }
}
</script>
</body>
</html>
