<!-- @dsCard group="Projects" height=210 subtitle="Repo and project summary figures" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font:400 13px/18px var(--font-sans)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.th{background:var(--island);color:var(--text);padding:var(--space-5);border-radius:var(--radius-xl);display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.c{background:var(--island-raised);border-radius:var(--radius-xl);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.v{font:600 24px/30px var(--font-sans)}
.k{color:var(--text-muted);font:400 12px/16px var(--font-sans)}
.p{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--radius-xs);background:var(--warning-bg);color:var(--warning-text);font:500 11.5px/16px var(--font-sans);width:max-content;margin-top:4px}
.ic{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="pair">
  <div class="th" data-theme="dark">
    <div class="c"><span class="v">6</span><span class="k">Repositories</span></div>
    <div class="c"><span class="v">4.8k</span><span class="k">Commits</span><span class="p"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.01"/></svg>Partial</span></div>
    <div class="c"><span class="v">~23</span><span class="k">Contributors</span></div>
  </div>
  <div class="th" data-theme="light">
    <div class="c"><span class="v">6</span><span class="k">Repositories</span></div>
    <div class="c"><span class="v">4.8k</span><span class="k">Commits</span><span class="p"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.01"/></svg>Partial</span></div>
    <div class="c"><span class="v">~23</span><span class="k">Contributors</span></div>
  </div>
</div>
</body></html>
