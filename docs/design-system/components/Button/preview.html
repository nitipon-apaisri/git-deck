<!-- @dsCard group="Controls" height=240 subtitle="Primary, ghost, icon and focus" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font:400 13px/18px var(--font-sans)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.th{background:var(--island);color:var(--text);padding:var(--space-6);border-radius:var(--radius-xl);display:flex;flex-direction:column;gap:16px}
.r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{color:var(--text-muted);font:400 12px/16px var(--font-sans)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:var(--radius-md);border:1px solid var(--line);background:transparent;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:500}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;color:var(--accent-text)}
.btn:focus-visible,.ib:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:32px;height:32px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--text-muted);display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--text)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:14px;height:14px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
<symbol id="split" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M12 5v14"/></symbol>
</svg>
<div class="pair">
  <div class="th" data-theme="dark">
    <div class="r"><button class="btn primary">Add account</button><button class="btn">Cancel</button><button class="btn ghost">Create token</button><button class="btn" disabled>Disabled</button></div>
    <div class="r"><button class="btn"><svg class="ic s" viewBox="0 0 24 24"><use href="#plus"/></svg>Add repository</button><button class="btn focus">Focused</button></div>
    <div class="r"><button class="ib" aria-label="Split view"><svg class="ic" viewBox="0 0 24 24"><use href="#split"/></svg></button><button class="ib" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><use href="#gear"/></svg></button><span class="lbl">Icon buttons, 32px</span></div>
  </div>
  <div class="th" data-theme="light">
    <div class="r"><button class="btn primary">Add account</button><button class="btn">Cancel</button><button class="btn ghost">Create token</button><button class="btn" disabled>Disabled</button></div>
    <div class="r"><button class="btn"><svg class="ic s" viewBox="0 0 24 24"><use href="#plus"/></svg>Add repository</button><button class="btn focus">Focused</button></div>
    <div class="r"><button class="ib" aria-label="Split view"><svg class="ic" viewBox="0 0 24 24"><use href="#split"/></svg></button><button class="ib" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><use href="#gear"/></svg></button><span class="lbl">Icon buttons, 32px</span></div>
  </div>
</div>
</body></html>
