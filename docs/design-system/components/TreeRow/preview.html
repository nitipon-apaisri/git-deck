<!-- @dsCard group="Navigation" height=300 subtitle="Host group and repository rows" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font:400 13px/18px var(--font-sans)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.th{background:var(--island);color:var(--text);padding:var(--space-3);border-radius:var(--radius-xl)}
.row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--radius-md)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--selection);font-weight:500}
.row.l2{padding-left:30px}
.host{width:20px;height:20px;border-radius:var(--radius-sm);display:grid;place-items:center;font:600 10px/1 var(--font-sans);flex:none}
.gh{background:var(--host-github)}.gl{background:var(--host-gitlab)}.sh{background:var(--host-selfhosted)}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--text-muted);font:400 12px/16px var(--font-sans)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}
.chev{width:14px;height:14px;fill:none;stroke:var(--text-muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{display:flex;align-items:center;gap:6px;color:var(--text-muted);font:400 12px/16px var(--font-sans)}
</style></head>
<body>
<div class="pair">
  <div class="th" data-theme="dark">
    <div class="row"><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span class="host gh">GH</span><span class="name">github.com</span><span class="cnt">14</span></div>
    <div class="row l2"><span class="dot" title="Cloned"></span><span class="name">acme/web-app</span><span class="cnt">1.2k</span></div>
    <div class="row l2 sel"><span class="dot" title="Cloned"></span><span class="name">acme/api-gateway</span><span class="cnt">842</span></div>
    <div class="row l2"><span class="cap" style="width:8px"></span><span class="name">acme/docs</span><span class="cnt">Not cloned</span></div>
    <div class="row"><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="host sh">SH</span><span class="name">gitlab.acme.dev</span><span class="cnt">21</span></div>
  </div>
  <div class="th" data-theme="light">
    <div class="row"><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span class="host gh">GH</span><span class="name">github.com</span><span class="cnt">14</span></div>
    <div class="row l2"><span class="dot" title="Cloned"></span><span class="name">acme/web-app</span><span class="cnt">1.2k</span></div>
    <div class="row l2 sel"><span class="dot" title="Cloned"></span><span class="name">acme/api-gateway</span><span class="cnt">842</span></div>
    <div class="row l2"><span class="cap" style="width:8px"></span><span class="name">acme/docs</span><span class="cnt">Not cloned</span></div>
    <div class="row"><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="host sh">SH</span><span class="name">gitlab.acme.dev</span><span class="cnt">21</span></div>
  </div>
</div>
</body></html>
