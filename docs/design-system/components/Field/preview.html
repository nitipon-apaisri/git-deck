<!-- @dsCard group="Controls" height=300 subtitle="Text input, token input and certificate toggle" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font:400 13px/18px var(--font-sans)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.th{background:var(--island);color:var(--text);padding:var(--space-6);border-radius:var(--radius-xl);display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
label{font-weight:500}
input[type=text],input[type=password]{height:36px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--island-raised);color:var(--text);font:inherit;outline:0}
input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.hint{color:var(--text-muted);font:400 12px/16px var(--font-sans)}
.mono{font-family:var(--font-mono)}
.box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--island-raised)}
.box label{display:flex;align-items:center;gap:10px}
.warn{display:flex;gap:8px;color:var(--warning-text);font:400 12px/16px var(--font-sans)}
input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.ic{width:14px;height:14px;margin-top:1px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="pair">
  <div class="th" data-theme="dark">
    <div class="f"><label for="d1">Base URL</label><input id="d1" type="text" value="https://gitlab.acme.dev"></div>
    <div class="f"><label for="d2">Access token</label><input id="d2" type="password" value="glpat-xxxxxxxx"><span class="hint">Needs the <span class="mono">read_api</span> and <span class="mono">read_repository</span> scopes.</span></div>
    <div class="box"><label><input type="checkbox">Allow self-signed certificate for this host</label><span class="warn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.01"/></svg>Only enable this for hosts you trust.</span></div>
  </div>
  <div class="th" data-theme="light">
    <div class="f"><label for="l1">Base URL</label><input id="l1" type="text" value="https://gitlab.acme.dev"></div>
    <div class="f"><label for="l2">Access token</label><input id="l2" type="password" value="glpat-xxxxxxxx"><span class="hint">Needs the <span class="mono">read_api</span> and <span class="mono">read_repository</span> scopes.</span></div>
    <div class="box"><label><input type="checkbox">Allow self-signed certificate for this host</label><span class="warn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.01"/></svg>Only enable this for hosts you trust.</span></div>
  </div>
</div>
</body></html>
